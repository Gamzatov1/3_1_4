<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">
            <span id="headerUsername"></span>
            with roles:
            <span id="headerRoles"></span>
        </span>
        <a class="btn btn-dark" href="/logout">Logout</a>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <!-- Left sidebar -->
        <div class="col-2 p-0">
            <div class="nav flex-column nav-pills pt-3" role="tablist">
                <a class="nav-link active" data-bs-toggle="pill" href="#admin" role="tab">Admin</a>
                <a class="nav-link" data-bs-toggle="pill" href="#user" role="tab">User</a>
            </div>
        </div>

        <!-- Main content -->
        <div class="col-10 bg-light">
            <div class="tab-content p-3">
                <!-- Admin Panel -->
                <div class="tab-pane fade show active" id="admin">
                    <h1>Admin panel</h1>
                    
                    <!-- Nav tabs -->
                    <ul class="nav nav-tabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="usersTable-tab" data-bs-toggle="tab" href="#usersTable">Users table</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="newUser-tab" data-bs-toggle="tab" href="#newUser">New User</a>
                        </li>
                    </ul>

                    <!-- Tab content -->
                    <div class="tab-content">
                        <!-- Users Table -->
                        <div class="tab-pane fade show active" id="usersTable">
                            <div class="card">
                                <div class="card-header">
                                    <h4>All users</h4>
                                </div>
                                <div class="card-body">
                                    <table class="table table-striped">
                                        <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Username</th>
                                            <th>Last Name</th>
                                            <th>Age</th>
                                            <th>Email</th>
                                            <th>Role</th>
                                            <th>Edit</th>
                                            <th>Delete</th>
                                        </tr>
                                        </thead>
                                        <tbody id="userTableBody">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- New User Form -->
                        <div class="tab-pane fade" id="newUser">
                            <div class="card">
                                <div class="card-header">
                                    <h4>Add new user</h4>
                                </div>
                                <div class="card-body">
                                    <form id="newUserForm" onsubmit="createUser(); return false;">
                                        <div class="form-group">
                                            <label for="newUsername">Username</label>
                                            <input type="text" class="form-control" id="newUsername" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="newLastName">Last Name</label>
                                            <input type="text" class="form-control" id="newLastName" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="newAge">Age</label>
                                            <input type="number" class="form-control" id="newAge" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="newEmail">Email</label>
                                            <input type="email" class="form-control" id="newEmail" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="newPassword">Password</label>
                                            <input type="password" class="form-control" id="newPassword" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="newRoles">Role</label>
                                            <select multiple class="form-control" id="newRoles" required>
                                            </select>
                                        </div>
                                        <button type="submit" class="btn btn-success">Add new user</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Info Panel -->
                <div class="tab-pane fade" id="user">
                    <h1>User information-page</h1>
                    <div class="card">
                        <div class="card-header">
                            <h4>About user</h4>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                </tr>
                                </thead>
                                <tbody id="currentUserTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label for="editUsername">Username</label>
                        <input type="text" class="form-control" id="editUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="editLastName">Last Name</label>
                        <input type="text" class="form-control" id="editLastName" required>
                    </div>
                    <div class="form-group">
                        <label for="editAge">Age</label>
                        <input type="number" class="form-control" id="editAge" required>
                    </div>
                    <div class="form-group">
                        <label for="editEmail">Email</label>
                        <input type="email" class="form-control" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="editPassword">Password</label>
                        <input type="password" class="form-control" id="editPassword">
                    </div>
                    <div class="form-group">
                        <label for="editRoles">Role</label>
                        <select multiple class="form-control" id="editRoles" required>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="updateUser()">Edit</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="deleteForm">
                    <input type="hidden" id="deleteId">
                    <div class="form-group">
                        <label>Username</label>
                        <p id="deleteUsername"></p>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <p id="deleteLastName"></p>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <p id="deleteAge"></p>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <p id="deleteEmail"></p>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <p id="deleteRoles"></p>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-danger" onclick="deleteUser()">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/userTable.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/newUser.js"></script>
<script src="/js/currentUser.js"></script>

</body>
</html>
